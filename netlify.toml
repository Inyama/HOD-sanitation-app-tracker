# Netlify deployment (demo). Netlify detects Next.js and applies its Next.js runtime automatically.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Dummy data, the Demo ribbon and the simulate controls stay on until Phase 8 adds the real backend.
  NEXT_PUBLIC_DEMO_MODE = "true"
  NEXT_TELEMETRY_DISABLED = "1"
  # Git hooks are for local commits only.
  HUSKY = "0"
